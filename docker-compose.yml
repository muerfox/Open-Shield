name: open-shield

networks:
  openshield:
    driver: bridge

volumes:
  pgdata:
  redisdata:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/00-create-user-db.sh:/docker-entrypoint-initdb.d/00-create-user-db.sh:ro
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    networks:
      - openshield
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    ports:
      # Loopback-only, so the host-networked openresty container (which no
      # longer shares this bridge network) can still reach redis via
      # 127.0.0.1 — not reachable from outside this machine.
      - "127.0.0.1:6379:6379"
    networks:
      - openshield
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  powerdns:
    image: pschiffe/pdns-pgsql:alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PDNS_launch: gpgsql
      PDNS_gpgsql_host: postgres
      PDNS_gpgsql_port: "5432"
      PDNS_gpgsql_user: ${POSTGRES_USER}
      PDNS_gpgsql_password: ${POSTGRES_PASSWORD}
      PDNS_gpgsql_dbname: pdns
      PDNS_api: "yes"
      PDNS_api_key: ${PDNS_API_KEY}
      PDNS_webserver: "yes"
      PDNS_webserver_address: "0.0.0.0"
      PDNS_webserver_allow_from: "0.0.0.0/0"
      PDNS_default_ttl: "3600"
      PDNS_version_string: "Open-Shield"
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    networks:
      - openshield
    healthcheck:
      # The image is built from bare alpine + only PowerDNS packages — no
      # wget/curl — so use its own control-socket ping instead of an HTTP
      # check.
      test: ["CMD", "pdns_control", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  panel:
    build: ./panel
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      powerdns:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/panel
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      PDNS_API_URL: http://powerdns:8081/api/v1
      PDNS_API_KEY: ${PDNS_API_KEY}
      PDNS_DEFAULT_NS: ${PDNS_DEFAULT_NS}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      EDGE_PUBLIC_HOST: ${EDGE_PUBLIC_HOST:-}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_FAIL_WINDOW_SECONDS: ${LOGIN_FAIL_WINDOW_SECONDS:-900}
      LOGIN_LOCKOUT_BASE_SECONDS: ${LOGIN_LOCKOUT_BASE_SECONDS:-3600}
      LOGIN_LOCKOUT_MAX_SECONDS: ${LOGIN_LOCKOUT_MAX_SECONDS:-86400}
    ports:
      # Loopback-only, and on a *different* host port (8090, not 8080):
      # openresty (below) is the actual public entry point for 8080 now,
      # binding it directly on the host (network_mode: host) — a bind to
      # 127.0.0.1:8080 here would conflict with that wildcard 0.0.0.0:8080
      # bind (you can't hold both a specific-interface and a wildcard bind
      # on the same port). Not reachable at all from outside this machine.
      - "127.0.0.1:8090:8080"
    networks:
      - openshield
    # (healthcheck comes from panel/Dockerfile's own HEALTHCHECK)

  openresty:
    build: ./openresty
    restart: unless-stopped
    # Host networking: binds 80/443 directly on the server's real
    # interfaces (so nginx sees genuine client IPs, no Docker NAT in the
    # path) and puts 127.0.0.1 inside this container == the host's real
    # loopback, so it can proxy_pass straight to any other container/app
    # you've published to 127.0.0.1:<port> on this machine. Linux-only;
    # `ports:`/`networks:` are dropped since they don't apply in this mode.
    network_mode: host
    depends_on:
      redis:
        condition: service_healthy
      panel:
        condition: service_healthy
    environment:
      # redis is still on the isolated `openshield` bridge network; reach
      # it via the loopback port published above now that this container
      # no longer shares that network.
      REDIS_URL: redis://:${REDIS_PASSWORD}@127.0.0.1:6379/0
      ACME_EMAIL: ${ACME_EMAIL}

  demo-origin:
    image: traefik/whoami
    restart: unless-stopped
    profiles: ["demo"]
    ports:
      # Published the same way any real origin container would be, so it's
      # reachable from the host-networked openresty at 127.0.0.1:8081.
      - "127.0.0.1:8081:80"
    networks:
      - openshield
