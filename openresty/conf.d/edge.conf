# --- HTTP :80 -------------------------------------------------------------
# Handles ACME HTTP-01 challenges, serves domains with ssl_mode "off"
# directly (no redirect), and redirects everything else to HTTPS.
server {
    listen 80 default_server;
    server_name _;

    set $upstream_scheme '';
    set $upstream_host '';
    set $upstream_port '';
    set $no_cache '1';

    include /etc/openresty/conf.d/_error_page.inc;

    location /.well-known/acme-challenge/ {
        content_by_lua_block {
            auto_ssl:challenge_server()
        }
    }

    location / {
        access_by_lua_block {
            require("edge").handle(false)
        }
        include /etc/openresty/conf.d/_proxy_pass.inc;
    }
}

# --- HTTPS :443 -------------------------------------------------------------
# The public CDN + WAF edge for domains with ssl_mode "auto" or "manual".
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate_by_lua_block {
        local ssl = require "ngx.ssl"
        local host = ssl.server_name()
        if host then
            host = host:lower()
            local router = require "router"
            local cfg = router.resolve(host)
            if cfg and cfg.ssl_mode == "manual" then
                require("manual_ssl").set_cert(host)
            elseif cfg and cfg.ssl_mode == "auto" then
                -- lua-resty-auto-ssl has no built-in failure backoff: a
                -- domain that can't get a cert (bad DNS, port 80
                -- unreachable, etc.) would otherwise retry a *synchronous*
                -- ACME request against Let's Encrypt on every single
                -- HTTPS request, blocking that request's whole handshake
                -- and risking Let's Encrypt's own rate limits. Skip the
                -- retry for a while after a failed attempt instead.
                local settings = ngx.shared.auto_ssl_settings
                local backoff_key = "issue_backoff:" .. host
                if not settings:get(backoff_key) then
                    auto_ssl:ssl_certificate()
                    -- Same shared-dict key lua-resty-auto-ssl itself
                    -- writes to on a successful issuance/cache hit.
                    if not ngx.shared.auto_ssl:get("domain:fullchain_der:" .. host) then
                        local ok, err = settings:set(backoff_key, true, 120)
                        if not ok then
                            ngx.log(ngx.ERR, "auto-ssl backoff: failed to set flag for ", host, ": ", err)
                        end
                        ngx.log(ngx.WARN, "auto-ssl: cert issuance did not succeed for ", host, ", backing off retries for 120s")
                    end
                end
            end
            -- ssl_mode "off" (or unknown host): fall through to the static
            -- fallback cert below; edge.lua will still 404/serve normally.
        end
    }

    # Static fallback so nginx has something to start with.
    ssl_certificate     /etc/ssl/resty-auto-ssl-fallback.crt;
    ssl_certificate_key /etc/ssl/resty-auto-ssl-fallback.key;

    set $upstream_scheme '';
    set $upstream_host '';
    set $upstream_port '';
    set $no_cache '1';

    include /etc/openresty/conf.d/_error_page.inc;

    location / {
        access_by_lua_block {
            require("edge").handle(true)
        }
        include /etc/openresty/conf.d/_proxy_pass.inc;
    }
}

# --- Internal hook server for lua-resty-auto-ssl ---------------------------
server {
    listen 127.0.0.1:8999;

    client_body_buffer_size 128k;
    client_max_body_size 128k;

    location / {
        content_by_lua_block {
            auto_ssl:hook_server()
        }
    }
}
