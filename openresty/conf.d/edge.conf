# --- HTTP :80 -------------------------------------------------------------
# Handles ACME HTTP-01 challenges, serves domains with ssl_mode "off"
# directly (no redirect), and redirects everything else to HTTPS.
server {
    listen 80 default_server;
    server_name _;

    set $upstream_scheme '';
    set $upstream_host '';
    set $upstream_port '';
    set $no_cache '1';

    location /.well-known/acme-challenge/ {
        content_by_lua_block {
            auto_ssl:challenge_server()
        }
    }

    location / {
        access_by_lua_block {
            require("edge").handle(false)
        }
        include /etc/openresty/conf.d/_proxy_pass.inc;
    }
}

# --- HTTPS :443 -------------------------------------------------------------
# The public CDN + WAF edge for domains with ssl_mode "auto" or "manual".
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate_by_lua_block {
        local ssl = require "ngx.ssl"
        local host = ssl.server_name()
        if host then
            host = host:lower()
            local router = require "router"
            local cfg = router.resolve(host)
            if cfg and cfg.ssl_mode == "manual" then
                require("manual_ssl").set_cert(host)
            elseif cfg and cfg.ssl_mode == "auto" then
                auto_ssl:ssl_certificate()
            end
            -- ssl_mode "off" (or unknown host): fall through to the static
            -- fallback cert below; edge.lua will still 404/serve normally.
        end
    }

    -- Static fallback so nginx has something to start with.
    ssl_certificate     /etc/ssl/resty-auto-ssl-fallback.crt;
    ssl_certificate_key /etc/ssl/resty-auto-ssl-fallback.key;

    set $upstream_scheme '';
    set $upstream_host '';
    set $upstream_port '';
    set $no_cache '1';

    location / {
        access_by_lua_block {
            require("edge").handle(true)
        }
        include /etc/openresty/conf.d/_proxy_pass.inc;
    }
}

# --- Internal hook server for lua-resty-auto-ssl ---------------------------
server {
    listen 127.0.0.1:8999;

    client_body_buffer_size 128k;
    client_max_body_size 128k;

    location / {
        content_by_lua_block {
            auto_ssl:hook_server()
        }
    }
}
