# --- HTTP :80 -------------------------------------------------------------
# Handles ACME HTTP-01 challenges and otherwise redirects to HTTPS.
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        content_by_lua_block {
            auto_ssl:challenge_server()
        }
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS :443 -------------------------------------------------------------
# The public CDN + WAF edge. Dynamically issues/serves certs per SNI host
# via lua-resty-auto-ssl, then routes + inspects the request.
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate_by_lua_block {
        auto_ssl:ssl_certificate()
    }

    # Static fallback so nginx has something to start with; auto-ssl
    # overrides this per-request for known SNI hosts.
    ssl_certificate     /etc/ssl/resty-auto-ssl-fallback.crt;
    ssl_certificate_key /etc/ssl/resty-auto-ssl-fallback.key;

    # Variables set by router.lua for the dynamic proxy_pass below.
    set $upstream_scheme '';
    set $upstream_host '';
    set $upstream_port '';
    set $no_cache '1';

    location / {
        access_by_lua_block {
            local router = require "router"
            local waf = require "waf"

            local cfg = router.resolve(ngx.var.host)
            if not cfg or not cfg.proxied then
                ngx.status = 404
                ngx.header["Content-Type"] = "text/plain"
                ngx.say("Unknown domain")
                return ngx.exit(404)
            end

            router.configure_upstream(cfg)

            if cfg.waf_enabled then
                waf.enforce(cfg)
            end
        }

        header_filter_by_lua_block {
            local cfg = ngx.ctx.domain_cfg
            if cfg and cfg.cache_enabled then
                ngx.header["X-Accel-Expires"] = tostring(cfg.cache_ttl)
            end
        }

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_cache edge_cache;
        proxy_cache_key $scheme$host$request_uri;
        proxy_cache_valid 200 302 60s;
        proxy_cache_bypass $no_cache;
        proxy_no_cache $no_cache;
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_pass $upstream_scheme://$upstream_host:$upstream_port;
    }
}

# --- Internal hook server for lua-resty-auto-ssl ---------------------------
server {
    listen 127.0.0.1:8999;

    client_body_buffer_size 128k;
    client_max_body_size 128k;

    location / {
        content_by_lua_block {
            auto_ssl:hook_server()
        }
    }
}
