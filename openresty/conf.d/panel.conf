# Rate-limited public front door for the admin panel. docker-compose
# publishes the panel container's 8080 to 127.0.0.1 only, so this is the
# only way into it from outside the machine.
#
# Deliberately plain nginx rate limiting (no Lua/Redis involved) rather
# than going through edge.lua/waf.lua — the panel isn't "a domain" in its
# own Redis-driven routing table (that would be a bootstrapping problem:
# you'd need the panel working to configure the panel's own protection),
# and keeping this path free of the Redis dependency means it still works
# even if something's wrong with Redis/the CDN pipeline. This is on top
# of, not instead of, the app-level login lockout in panel/app/login_guard.py.

limit_req_zone $binary_remote_addr zone=panel_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=panel_general:10m rate=20r/s;
limit_req_status 429;

server {
    listen 8080;
    server_name _;

    # The login endpoint gets its own tight limit — a handful of attempts
    # per minute per IP, on top of the app's own escalating lockout.
    location = /login {
        limit_req zone=panel_login burst=5 nodelay;
        include /etc/openresty/conf.d/_panel_proxy.inc;
    }

    # Generous general limit — just enough to stop a flood/DoS, well above
    # anything normal panel usage (including HTMX polling) would ever hit.
    location / {
        limit_req zone=panel_general burst=40 nodelay;
        include /etc/openresty/conf.d/_panel_proxy.inc;
    }
}
