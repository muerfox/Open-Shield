worker_processes auto;
error_log /dev/stderr notice;
pid /run/nginx.pid;

# Make these visible to os.getenv() from Lua (nginx clears the environment
# for worker processes by default unless explicitly whitelisted here).
env REDIS_URL;
env ACME_EMAIL;

events {
    worker_connections 4096;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 20m;
    client_body_buffer_size 128k;

    # Docker's embedded DNS resolver, used both for OCSP stapling and for
    # resolving origin/backend hostnames at request time.
    resolver 127.0.0.11 ipv6=off valid=30s;

    lua_package_path "/etc/openresty/lua/?.lua;;";

    lua_shared_dict auto_ssl 1m;
    lua_shared_dict auto_ssl_settings 64k;
    lua_shared_dict waf_cache 4m;

    proxy_cache_path /var/cache/openresty/edge levels=1:2 keys_zone=edge_cache:20m max_size=1g inactive=60m use_temp_path=off;

    init_by_lua_file /etc/openresty/lua/init.lua;
    init_worker_by_lua_block {
        auto_ssl:init_worker()
    }

    log_format edge '$remote_addr - [$time_iso8601] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" host=$host upstream=$upstream_addr cache=$upstream_cache_status';
    access_log /dev/stdout edge;

    include /etc/openresty/conf.d/*.conf;
}
